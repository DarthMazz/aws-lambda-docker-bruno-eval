name: lambda-bruno-eval

# Lambda / init で共通の AWS 設定。認証情報はダミーで、接続先はすべて moto。
x-aws-env: &aws-env
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-northeast-1}
  AWS_ENDPOINT_URL: http://moto:5000
  ORDERS_TABLE_NAME: ${ORDERS_TABLE_NAME:-Orders}
  ORDERS_BUCKET_NAME: ${ORDERS_BUCKET_NAME:-orders-bucket}

# Lambda サービスの共通設定。全関数で同じイメージを使う
x-lambda: &lambda
  image: lambda-bruno-eval-app:local
  build: .
  environment:
    <<: *aws-env
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
  depends_on:
    moto-init:
      condition: service_completed_successfully

services:
  moto:
    image: motoserver/moto:5.2.3
    ports:
      - "${MOTO_PORT:-5050}:5000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/moto-api/"]
      interval: 2s
      timeout: 3s
      retries: 30

  # moto にテーブル・バケット・初期データを作成して終了する
  moto-init:
    image: amazon/aws-cli:2.37.12
    entrypoint: ["bash", "/init/init.sh"]
    environment:
      <<: *aws-env
    volumes:
      - ./moto/init:/init:ro
    depends_on:
      moto:
        condition: service_healthy

  # Lambda 関数ごとに 1 サービス。イメージは全関数で共通（リポジトリ直下の Dockerfile）で、
  # command でハンドラを切り替える（AWS の CloudFormation で ImageConfig.Command を上書きするのと同じ）。
  # 追加時は x-lambda を取り込み、command とポート（9001, 9002 ...）を指定する
  register-order:
    <<: *lambda
    command: ["handler.register_order_function.lambda_handler"]
    ports:
      - "${REGISTER_ORDER_PORT:-9000}:8080"

  get-order:
    <<: *lambda
    command: ["handler.get_order_function.lambda_handler"]
    ports:
      - "${GET_ORDER_PORT:-9001}:8080"
